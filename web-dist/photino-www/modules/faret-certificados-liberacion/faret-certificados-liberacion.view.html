<div class="module">

    <div class="module-header">
        <div>
            <div class="module-title">Certificados de Liberación</div>
            <div class="subtitle">Búsqueda y descarga de certificados ya emitidos (FARET SPA / INNPACK SPA)</div>
        </div>
    </div>

    <div class="card">
        <div class="filters">
            <div>
                <label for="fclFiltroFolio">Folio</label><br>
                <input type="text" id="fclFiltroFolio" placeholder="Ej. 75014">
            </div>
            <div>
                <label for="fclFiltroNp">NP</label><br>
                <input type="text" id="fclFiltroNp" placeholder="Ej. 22780">
            </div>
            <div>
                <label for="fclFiltroCliente">Cliente</label><br>
                <input type="text" id="fclFiltroCliente" placeholder="Nombre del cliente">
            </div>
            <div>
                <label for="fclFiltroOperador">Operador</label><br>
                <select id="fclFiltroOperador">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label for="fclFiltroInspector">Inspector</label><br>
                <select id="fclFiltroInspector">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label for="fclFiltroEmpresa">Empresa</label><br>
                <select id="fclFiltroEmpresa">
                    <option value="">Todas</option>
                    <option value="FARET SPA">FARET SPA</option>
                    <option value="INNPACK SPA">INNPACK SPA</option>
                </select>
            </div>
            <div>
                <label for="fclFiltroFechaDesde">Fecha desde</label><br>
                <input type="date" id="fclFiltroFechaDesde">
            </div>
            <div>
                <label for="fclFiltroFechaHasta">Fecha hasta</label><br>
                <input type="date" id="fclFiltroFechaHasta">
            </div>
            <div style="align-self:flex-end;">
                <button class="btn-primary" id="fclBtnBuscar">Buscar</button>
                <button class="btn-secondary" id="fclBtnLimpiar">Limpiar</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="module-title" id="fclResultadosTitulo">Certificados (últimos 200 sin filtros)</div>
        <div class="table-container">
            <table class="table" id="fclTabla">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Empresa</th>
                        <th>NP</th>
                        <th>Cliente</th>
                        <th>Ítem</th>
                        <th>Código</th>
                        <th>Descripción</th>
                        <th>Cant. Base</th>
                        <th>Cant. Liberación</th>
                        <th>Operador</th>
                        <th>Inspector</th>
                        <th>Fecha Liberación</th>
                        <th>Bodega Destino</th>
                        <th>Certificado</th>
                    </tr>
                </thead>

                <tbody id="fclTbody">
                    <tr>
                        <td colspan="14">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
