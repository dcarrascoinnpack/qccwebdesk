spring:
  application:
    name: qcc-api
  profiles:
    default: dev

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

qcc:
  jwt:
    secret: ${QCC_JWT_SECRET}
    expiration-minutes: ${QCC_JWT_EXPIRATION_MINUTES:60}
