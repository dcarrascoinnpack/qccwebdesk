# Configuración del gateway web (cl.faret.qccweb). Independiente de application.yaml (app legacy).
# Rutas y puertos se sobrescriben por variables de entorno; aquí no hay secretos.

spring:
  application:
    name: qcc-web-gateway

server:
  port: ${QCC_WEB_PORT:8086}
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    session:
      # Sesión server-side: el navegador solo recibe un id opaco en esta cookie.
      timeout: ${QCC_WEB_SESSION_IDLE:30m}
      persistent: false          # nunca escribir sesiones (con el JWT upstream) a disco
      tracking-modes: cookie     # nunca ;jsessionid en la URL
      cookie:
        name: QCC_SESSION
        http-only: true
        secure: ${QCC_WEB_COOKIE_SECURE:true}   # los navegadores aceptan Secure en http://localhost
        same-site: strict
        path: /

qcc:
  web:
    # Generados por tools/sync-photino-www.ps1 (relativos a backend/ al ejecutar con mvnw)
    www-dir: ${QCC_WEB_WWW_DIR:../web-dist/photino-www}
    manifest-file: ${QCC_WEB_MANIFEST_FILE:../web-dist/web-manifest.json}
    contract:
      # No arrancar si el contract check del snapshot quedó BLOQUEANTE (REVISAR / SOLO_WEB).
      # Solo desactivar en desarrollo local mientras se trabaja una acción en revisión.
      bloquear-si-incompatible: ${QCC_WEB_CONTRACT_BLOQUEAR:true}
    api:
      # Tamaño máximo del cuerpo en /api/** (bridge y login). Se ampliará acción por acción si una
      # escritura futura lo necesita (p. ej. adjuntos), nunca de forma global sin revisar.
      max-body-bytes: ${QCC_WEB_API_MAX_BODY:262144}
      # SOLO /api/v1/bridge/archivo (adjuntos en base64; Fase 3k): PDF 10 MB → ~13,4 MB en base64 + JSON.
      max-body-bytes-archivo: ${QCC_WEB_API_MAX_BODY_ARCHIVO:14680064}
    auth:
      # Misma API y endpoint de login que usa Photino (config.json → QualityControlInnpackApi).
      innpack-api-base-url: ${QCC_INNPACK_API_BASE_URL:https://api.faret.cl/innpack}
      # Login FARET (Fase 6a): misma API y endpoint que Photino (config.json → QualityControlFaretApi, api/Auth/login).
      faret-api-base-url: ${QCC_FARET_API_BASE_URL:https://api.faret.cl/qualitycontrol}
      connect-timeout: 5s
      read-timeout: 30s   # = HttpClient.Timeout de Photino (InnpackApiClient.cs); el shim espera 35 s
      session-idle-timeout: ${QCC_WEB_SESSION_IDLE:30m}
      session-max-duration: ${QCC_WEB_SESSION_MAX:8h}   # además se respeta el exp del JWT upstream
      login-min-duration: 500ms
      # IPs del reverse proxy IIS (separadas por coma). Vacío = no se confía en X-Forwarded-For.
      trusted-proxies: ${QCC_WEB_TRUSTED_PROXIES:}
      cookie-secure: ${QCC_WEB_COOKIE_SECURE:true}
      rate-limit:
        max-intentos-por-ip: ${QCC_WEB_LOGIN_MAX_POR_IP:30}
        ventana-ip: 5m
        fallos-antes-de-bloqueo: 5
        bloqueo-base: 30s
        bloqueo-maximo: 15m

    faret:
      # Otras APIs FARET que Photino consume aparte de QualityControlFaret.Api (6b, config.json → MejoraContinuaFaretApi /
      # CalidadFaretApi). Photino NUNCA les manda token: el gateway tampoco. Vacío = "no configurada".
      mejora-continua-base-url: ${QCC_FARET_MC_API_BASE_URL:https://api.faret.cl/mejora-continua}
      calidad-base-url: ${QCC_FARET_CALIDAD_API_BASE_URL:https://api.faret.cl/calidad/api}

    fps:
      # fps-api (Fase 3v, columna "Liberación Calidad"): misma API que Photino (config.json → FpsApi). La API key
      # SOLO por variable de entorno (nunca en este archivo). Sin base URL = "fps-api no está configurada".
      base-url: ${QCC_FPS_API_BASE_URL:}
      api-key: ${QCC_FPS_API_KEY:}
      connect-timeout: 5s
      read-timeout: 20s          # = HttpClient.Timeout de FpsApiClient en Photino
      max-bytes-respuesta: 2097152

    sap:
      # apisapfaret (Fase 3y, "Nuevo lote" de Recepción): misma API que Photino (config.json → SapRecepcionApi). La API
      # key SOLO por variable de entorno (nunca en este archivo); apisapfaret admite una key por consumidor.
      base-url: ${QCC_SAP_API_BASE_URL:}
      api-key: ${QCC_SAP_API_KEY:}
      connect-timeout: 5s
      read-timeout: 25s          # = HttpClient.Timeout de SapRecepcionApiClient en Photino
      max-bytes-respuesta: 5242880

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    cl.faret.qccweb: INFO
    qcc.audit: INFO
