spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://${QCC_DB_HOST}:${QCC_DB_PORT:3306}/${QCC_DB_NAME}?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
    username: ${QCC_DB_USER}
    password: ${QCC_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

logging:
  level:
    root: INFO
    cl.faret.qcc: DEBUG
    org.hibernate.SQL: INFO